<div class="min-h-screen bg-gradient-to-br from-taxi-black to-gray-800 flex items-center justify-center px-4">
  <div class="max-w-md w-full">
    <!-- Logo y Título -->
    <div class="text-center mb-8">
      <div class="text-7xl mb-4 animate-bounce">🚕</div>
      <h1 class="text-5xl font-bold text-taxi-yellow">TaxiApp</h1>
      <p class="text-gray-300 mt-2">Sistema Profesional de Gestión de Taxis</p>
    </div>

    <!-- Tarjeta de Login -->
    <div class="bg-white rounded-2xl shadow-2xl p-8 transform transition-all">
      <h2 class="text-2xl font-bold text-center text-gray-800 mb-8">Iniciar Sesión</h2>
      
      <form (ngSubmit)="onSubmit()" class="space-y-6">
        <!-- Campo Usuario -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Usuario</label>
          <div class="relative group">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <svg class="h-5 w-5 text-gray-400 group-focus-within:text-taxi-yellow transition-colors" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"/>
              </svg>
            </div>
            <input
              type="text"
              [(ngModel)]="username"
              name="username"
              class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-taxi-yellow focus:border-transparent transition-all"
              placeholder="Ingrese su usuario"
              required
              autocomplete="username"
            />
          </div>
        </div>

        <!-- Campo Contraseña -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Contraseña</label>
          <div class="relative group">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <svg class="h-5 w-5 text-gray-400 group-focus-within:text-taxi-yellow transition-colors" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd"/>
              </svg>
            </div>
            <input
              type="password"
              [(ngModel)]="password"
              name="password"
              class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-taxi-yellow focus:border-transparent transition-all"
              placeholder="Ingrese su contraseña"
              required
              autocomplete="current-password"
            />
          </div>
        </div>

        <!-- Mensaje de Error -->
        <div *ngIf="errorMessage" class="bg-red-50 border-l-4 border-red-500 p-4 rounded-lg">
          <div class="flex items-center">
            <div class="flex-shrink-0">
              <svg class="h-5 w-5 text-red-500" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>
              </svg>
            </div>
            <div class="ml-3">
              <p class="text-sm text-red-700">{{ errorMessage }}</p>
            </div>
          </div>
        </div>

        <!-- Botón de Login -->
        <button type="submit" [disabled]="loading" class="w-full btn-taxi py-3 text-lg font-semibold">
          <span *ngIf="!loading">Ingresar al Sistema</span>
          <span *ngIf="loading" class="flex items-center justify-center">
            <svg class="animate-spin h-5 w-5 mr-2" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
            </svg>
            Cargando...
          </span>
        </button>
      </form>

      <!-- Demo Credentials -->
      <div class="mt-6 p-4 bg-gray-50 rounded-lg">
        <p class="text-xs text-gray-500 text-center">Credenciales de prueba:</p>
        <p class="text-xs text-gray-500 text-center">Usuario: admin | Contraseña: admin123</p>
      </div>
    </div>
  </div>
</div>
